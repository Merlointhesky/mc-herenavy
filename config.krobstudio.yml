# ==========================================
#          HereNavy Configuration
# ==========================================

# -- Navigation Toggles --
navigation-visuals:
  skyrim-compass: true
  skyrim-compass-style: ACTIONBAR # Options: BOSSBAR, ACTIONBAR
  tomtom-arrow: true
  arrow-style: TEXT_DISPLAY # Options: TEXT_DISPLAY, PARTICLES, BOTH, NONE

# -- Exploration Progression --
max-level: 100
exp-per-new-biome: 50
exp-per-new-structure: 500

# -- Level Unlocks (Exploration Level requirements for POI tracking) --
# Formatted as Level -> List of Minecraft keys (structures or biomes)
unlocks:
  level_1:
    - "minecraft:village_plains"
    - "minecraft:plains"
    - "minecraft:forest"
    - "minecraft:desert"
    - "minecraft:ocean"
  level_5:
    - "minecraft:meadow"
    - "minecraft:village_desert"
    - "minecraft:village_savanna"
    - "minecraft:village_taiga"
  level_10:
    - "minecraft:village_snowy"
    - "minecraft:mineshaft"
    - "minecraft:mineshaft_mesa"
    - "minecraft:dark_forest"
    - "minecraft:swamp"
    - "minecraft:jungle"
    - "minecraft:dripstone_caves"
  level_15:
    - "minecraft:swamp_hut"
    - "minecraft:igloo"
  level_20:
    - "minecraft:pillager_outpost"
    - "minecraft:shipwreck"
    - "minecraft:shipwreck_beached"
    - "minecraft:savanna"
    - "minecraft:badlands"
    - "minecraft:lush_caves"
  level_30:
    - "minecraft:ruined_portal"
    - "minecraft:buried_treasure"
    - "minecraft:ocean_ruin_cold"
    - "minecraft:ocean_ruin_warm"
    - "minecraft:mangrove_swamp"
    - "minecraft:grove"
  level_40:
    - "minecraft:desert_pyramid"
    - "minecraft:jungle_pyramid"
    - "minecraft:trail_ruins"
    - "minecraft:cherry_grove"
    - "minecraft:ice_spikes"
  level_50:
    - "minecraft:fortress"
    - "minecraft:ruined_portal_nether"
    - "minecraft:frozen_peaks"
    - "minecraft:mushroom_fields"
  level_60:
    - "minecraft:monument"
    - "minecraft:mansion"
    - "minecraft:flower_forest"
  level_70:
    - "minecraft:trial_chambers"
    - "minecraft:nether_fossil"
  level_80:
    - "minecraft:bastion_remnant"
    - "minecraft:nether_wastes"
    - "minecraft:basalt_deltas"
    - "minecraft:crimson_forest"
    - "minecraft:warped_forest"
    - "minecraft:soul_sand_valley"
  level_90:
    - "minecraft:stronghold"
    - "minecraft:ancient_city"
    - "minecraft:end_city"
    - "minecraft:the_end"
    - "minecraft:deep_dark"
    - "minecraft:small_end_islands"
    - "minecraft:end_highlands"
  level_100:
    reward_item: ELYTRA
    reward_name: "<gold><bold>World Explorer</bold></gold>"

# ==========================================
#          BlueMap & BMarker Integration
# ==========================================
bluemap:
  enabled: true
  icon-size:
    width: 32
    height: 32
  icon-anchor:
    x: 16
    y: 16
  # The base URL to use for structure icons. If a relative filename is configured, this URL is prepended.
  # Options:
  # - "https://minecraft.wiki/w/Special:FilePath/" - Loads official high-quality icons directly from the Minecraft Wiki.
  # - "https://mcmap.krobstudio.uk/icons/" - Krobstudio custom high-resolution server icons.
  # - "icons/" - Locally copied icons served by BlueMap relative to its web root.
  icon-base-url: "https://mcmap.krobstudio.uk/icons/"
  # Configure custom marker sets. Structures mapped to the same ID will be grouped together.
  # If a structure is not listed here, it will automatically fall back to its own formatted set name.
  marker-sets:
    "minecraft:village_plains":
      id: "villages"
      label: "Villages"
    "minecraft:village_desert":
      id: "villages"
      label: "Villages"
    "minecraft:village_savanna":
      id: "villages"
      label: "Villages"
    "minecraft:village_taiga":
      id: "villages"
      label: "Villages"
    "minecraft:village_snowy":
      id: "villages"
      label: "Villages"
    "minecraft:mineshaft":
      id: "mineshafts"
      label: "Mineshafts"
    "minecraft:mineshaft_mesa":
      id: "mineshafts"
      label: "Mineshafts"
    "minecraft:shipwreck":
      id: "shipwrecks"
      label: "Shipwrecks"
    "minecraft:shipwreck_beached":
      id: "shipwrecks"
      label: "Shipwrecks"
    "minecraft:ocean_ruin_cold":
      id: "ocean_ruins"
      label: "Ocean Ruins"
    "minecraft:ocean_ruin_warm":
      id: "ocean_ruins"
      label: "Ocean Ruins"
  # Loaded automatically from default_icons.yml if missing or empty here.
  # Leave empty or specify custom URLs/filenames here to override default icons.
  icons:
    "minecraft:village_plains": "block/oak_planks.png"
    "minecraft:village_desert": "block/sandstone.png"
    "minecraft:village_savanna": "block/acacia_planks.png"
    "minecraft:village_taiga": "block/spruce_planks.png"
    "minecraft:village_snowy": "block/snow.png"
    "minecraft:mineshaft": "item/minecart.png"
    "minecraft:mineshaft_mesa": "item/chest_minecart.png"
    "minecraft:swamp_hut": "item/cauldron.png"
    "minecraft:igloo": "block/packed_ice.png"
    "minecraft:pillager_outpost": "item/ominous_bottle.png"
    "minecraft:shipwreck": "item/oak_boat.png"
    "minecraft:shipwreck_beached": "chest.png"
    "minecraft:ruined_portal": "block/crying_obsidian.png"
    "minecraft:buried_treasure": "item/heart_of_the_sea.png"
    "minecraft:ocean_ruin_cold": "block/prismarine_bricks.png"
    "minecraft:ocean_ruin_warm": "item/sniffer_egg.png"
    "minecraft:desert_pyramid": "block/chiseled_sandstone.png"
    "minecraft:jungle_pyramid": "block/mossy_cobblestone.png"
    "minecraft:trail_ruins": "block/suspicious_gravel_0.png"
    "minecraft:fortress": "block/nether_bricks.png"
    "minecraft:ruined_portal_nether": "block/crying_obsidian.png"
    "minecraft:monument": "block/dark_prismarine.png"
    "minecraft:mansion": "item/totem_of_undying.png"
    "minecraft:trial_chambers": "item/trial_key.png"
    "minecraft:nether_fossil": "block/bone_block_side.png"
    "minecraft:bastion_remnant": "block/gilded_blackstone.png"
    "minecraft:stronghold": "item/ender_eye.png"
    "minecraft:ancient_city": "block/sculk_catalyst_top.png"
    "minecraft:end_city": "block/purpur_block.png"

# -- Admin Custom Controls --
# Holds list of structures disabled by administration (admin GUI toggles)
untracked-structures: []
